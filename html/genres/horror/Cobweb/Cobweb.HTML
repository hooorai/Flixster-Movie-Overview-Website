<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobweb</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../../../../css/styles.css">
    <!-- Fav Icon -->
    <link rel="shortcut icon" href="../../../../img/fav-icon.png" type="image/x-icon">
    <!-- Box Icon -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Play Page -->
    <link rel="stylesheet" href="../../../../css/playpage.css">

</head>
<!-- Header -->
<header>
    <!-- Nav -->
    <div class="nav container">
        <!-- Logo -->
        <a href="../../../../index.html" class="logo">
            <!-- Movie<span>Vel</span> -->
            <img src="../../../../img/logo.png" alt="">
        </a>

        <!-- Nav Bar -->
        <div class="navbar">
            <a href="../../../../index.html" class="nav-link">
                <i class="bx bx-home"></i>
                <span class="nav-link-title">Home</span>
            </a>
            <a href="../../../../genrepage.html" class="nav-link nav-active">
                <i class="bx bx-camera-movie"></i>
                <span class="nav-link-title">Genre</span>
            </a>
            <a href="../../../../explore.html" class="nav-link">
                <i class="bx bx-compass"></i>
                <span class="nav-link-title">Explore</span>
            </a>
            <a href="../../../../about.html" class="nav-link">
                <i class="bx bx-info-circle"></i>
                <span class="nav-link-title">About</span>
            </a>
        </div>
    </div>
</header>
<!-- Play Movie Container -->
<div class="play-container container">
    <!-- Play Image -->
    <img src="landscape.jpg" alt="" class="play-img">
    <!-- Play Text -->
    <div class="play-text">
        <h2>Cobweb</h2>
        <!-- Ratings -->
        <div class="rating">
            <i class="bx bxs-star"></i>
            <i class="bx bxs-star"></i>
            <i class="bx bxs-star"></i>
            <i class="bx bxs-star-half"></i>
            <i class="bx bx-star"></i>
        </div>
        <!-- Trailer Button -->
        <a href="#" class="watch-btn trailer">
            <i class="bx bx-right-arrow"></i>
            <span>Watch the trailer</span>
        </a>
    </div>
    <!-- Video Container -->
    <div class="video-container">
        <!-- Video-Box -->
        <div class="video-box">
            <iframe id="myvideo" width="560" height="315"
                src="https://www.youtube.com/embed/2QKg5SZ_35I?si=sLn9AAgp4u-RoQHt" title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <!-- Close Video Icon -->
            <i class="bx bx-x close-video"></i>
        </div>
    </div>
</div>
<!-- About -->
<div class="about-movie container">
    <!-- Movie Details -->
    <div class="about-movie-details">
        <div class="movie-poster">
            <img src="poster.jpg" alt="">
            <div class="share-button">
                <button id="shareBtn"><i class="bx bx-share"></i>&nbsp Share</button>
            </div>
        </div>
        <div class="about-movie-storyline">
            <div class="about-movie-title">
                <h2>Cobweb<span class="tag">(2023)</span></h2>
                <div class="facts">
                    <span class="certification">PG-13</span>
                    <span class="release">08/11/2023</span></span>
                    <span class="genres genre-separator">Horror, &nbsp;</span>
                    <span class="runtime genre-separator">1h 28m</span>
                </div>
            </div>
            <div class="header-info">
                <h3>Overview</h3>
                <div class="overview">
                </div>
            </div>
        </div>
    </div>


</div>
<!-- Movie Cast -->
<div class="about-movie-storyline container">
    <h3 class="top-cast">Top Cast</h3>
</div>
<div class="cast">
    <div class="cast-box">
        <img src="woody norman.jpeg" alt="" class="cast-img">
        <span class="cast-title">woody norman</span>
    </div>
    <div class="cast-box">
        <img src="antony starr.jpeg" alt="" class="cast-img">
        <span class="cast-title"> Antony Starr</span>
    </div>
    <div class="cast-box">
        <img src="Lizzy_Caplan.jpg" alt="" class="cast-img">
        <span class="cast-title"> Lizzy Caplan</span>

    </div>
</div>
<div class="about-movie-content container">
    <ul>
        <li class="border-bottom border-top">
            <span class="about-movie-subtitle">Director</span>
            <span class="about-movie-subtitle-content"> </span>
        </li>
    </ul>
</div>
